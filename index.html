<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rough Cut</title>
    <script>
      try {
        var t = localStorage.getItem('rough-cut-theme')
        document.documentElement.setAttribute('data-theme', t === 'dawn' ? 'dawn' : 'slate')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'slate')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
